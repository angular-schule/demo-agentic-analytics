# The test setup: every agent talks to a fake LLM instead of a real provider (contract/fake-llm.mjs),
# so the tests cost nothing and give the same answer every time. Real API keys are not used.
# Two more backends talk to the demo model, as the demo does without agent/.env.
#
# Contract tests, both backends and the separate agent service:
#   docker compose -f compose.yaml -f compose.test.yaml --profile dotnet --profile node --profile agent up -d --build
# Browser tests, one backend behind the web server:
#   docker compose -f compose.yaml -f compose.test.yaml --profile node up -d --build
services:
  fake-llm:
    build:
      context: contract
      additional_contexts:
        demo-model: demo-model
      dockerfile_inline: |
        FROM node:24-alpine
        COPY --from=demo-model server.mjs /demo-model/
        COPY fake-llm.mjs /contract/
        CMD ["node", "/contract/fake-llm.mjs"]
    ports:
      - 127.0.0.1:${FAKE_LLM_PORT:-4000}:4000

  dotnet-api:
    environment: &fake-model
      MODEL: anthropic/claude-sonnet-5-5
      ANTHROPIC_API_KEY: test-key
      ANTHROPIC_BASE_URL: http://fake-llm:4000/v1
      DEBUG_TRAFFIC: "on"
    depends_on:
      fake-llm:
        condition: service_started

  node-api:
    environment: *fake-model
    depends_on:
      fake-llm:
        condition: service_started

  agent:
    environment:
      <<: *fake-model
      # Both backends answer under data-api in this setup, so the agent service names one.
      DATA_API_URL: http://node-api:8080
    depends_on:
      fake-llm:
        condition: service_started

  # The same backends with a model in OpenAI's Chat Completions format (Mistral; OpenAI and Gemini
  # use the same path in the .NET backend), so both API formats are tested.
  dotnet-api-mistral:
    profiles: [dotnet]
    build: backends/dotnet
    environment:
      ConnectionStrings__Analytics: Server=sqlserver;Database=AdventureWorksDW;User Id=AnalyticsReader;Password=${ANALYTICS_READER_PASSWORD};TrustServerCertificate=True
      DATA_SCOPE: "*"
      MODEL: mistral/mistral-large-latest
      MISTRAL_API_KEY: test-key
      MISTRAL_BASE_URL: http://fake-llm:4000/v1
      DEBUG_TRAFFIC: "on"
    ports:
      - 127.0.0.1:8083:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      fake-llm:
        condition: service_started

  node-api-mistral:
    profiles: [node]
    build: backends/node
    environment:
      DATABASE_URL: postgres://analytics_reader:${ANALYTICS_READER_PASSWORD}@postgres:5432/adventureworks
      DATA_SCOPE: "*"
      MODEL: mistral/mistral-large-latest
      MISTRAL_API_KEY: test-key
      MISTRAL_BASE_URL: http://fake-llm:4000/v1
      DEBUG_TRAFFIC: "on"
    ports:
      - 127.0.0.1:8084:8080
    depends_on:
      postgres:
        condition: service_healthy
      fake-llm:
        condition: service_started

  # Mastra with an OpenAI model: it uses OpenAI's Responses API, the .NET backend Chat Completions.
  node-api-openai:
    profiles: [node]
    build: backends/node
    environment:
      DATABASE_URL: postgres://analytics_reader:${ANALYTICS_READER_PASSWORD}@postgres:5432/adventureworks
      DATA_SCOPE: "*"
      MODEL: openai/gpt-test
      OPENAI_API_KEY: test-key
      OPENAI_BASE_URL: http://fake-llm:4000/v1
      DEBUG_TRAFFIC: "on"
    ports:
      - 127.0.0.1:8085:8080
    depends_on:
      postgres:
        condition: service_healthy
      fake-llm:
        condition: service_started

  # Both backends with the demo model, configured by agent/demo.env alone.
  dotnet-api-demo:
    profiles: [dotnet]
    build: backends/dotnet
    environment:
      ConnectionStrings__Analytics: Server=sqlserver;Database=AdventureWorksDW;User Id=AnalyticsReader;Password=${ANALYTICS_READER_PASSWORD};TrustServerCertificate=True
      DATA_SCOPE: "*"
    env_file: agent/demo.env
    ports:
      - 127.0.0.1:8086:8080
    depends_on:
      sqlserver:
        condition: service_healthy

  node-api-demo:
    profiles: [node]
    build: backends/node
    environment:
      DATABASE_URL: postgres://analytics_reader:${ANALYTICS_READER_PASSWORD}@postgres:5432/adventureworks
      DATA_SCOPE: "*"
    env_file: agent/demo.env
    ports:
      - 127.0.0.1:8087:8080
    depends_on:
      postgres:
        condition: service_healthy
